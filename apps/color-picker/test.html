<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker MCP App - Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #e0e0e0;
    }
    .status.connected { background: #c8e6c9; }
    .status.error { background: #ffcdd2; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 8px;
      margin-right: 10px;
    }
    button:hover { background: #1565c0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .app-frame {
      width: 100%;
      height: 500px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-top: 20px;
      background: white;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Color Picker MCP App - Test</h1>

  <div class="status" id="status">Checking server connection...</div>

  <button id="loadBtn" disabled>Load Color Picker</button>
  <button id="callToolBtn" disabled>Call pick-color Tool</button>

  <iframe id="appFrame" class="app-frame" style="display:none"></iframe>

  <div class="result" id="result" style="display:none"></div>

  <script>
    const SERVER_URL = 'http://localhost:3001/mcp';
    const statusEl = document.getElementById('status');
    const loadBtn = document.getElementById('loadBtn');
    const callToolBtn = document.getElementById('callToolBtn');
    const appFrame = document.getElementById('appFrame');
    const resultEl = document.getElementById('result');

    async function mcpRequest(method, params = {}) {
      const response = await fetch(SERVER_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json, text/event-stream'
        },
        body: JSON.stringify({
          jsonrpc: '2.0',
          method,
          params,
          id: Date.now()
        })
      });

      const text = await response.text();
      // Parse SSE format
      const match = text.match(/data: (.+)/);
      if (match) {
        return JSON.parse(match[1]);
      }
      return JSON.parse(text);
    }

    async function checkConnection() {
      try {
        const result = await mcpRequest('initialize', {
          protocolVersion: '2024-11-05',
          capabilities: {},
          clientInfo: { name: 'test-host', version: '1.0.0' }
        });

        if (result.result) {
          statusEl.textContent = `Connected to: ${result.result.serverInfo.name} v${result.result.serverInfo.version}`;
          statusEl.className = 'status connected';
          loadBtn.disabled = false;
          callToolBtn.disabled = false;
        }
      } catch (e) {
        statusEl.textContent = `Error: Server not running. Start with: npm run serve`;
        statusEl.className = 'status error';
      }
    }

    async function loadApp() {
      try {
        const result = await mcpRequest('resources/read', {
          uri: 'ui://color-picker/mcp-app.html'
        });

        if (result.result?.contents?.[0]?.text) {
          const html = result.result.contents[0].text;
          appFrame.srcdoc = html;
          appFrame.style.display = 'block';
        }
      } catch (e) {
        resultEl.textContent = 'Error loading app: ' + e.message;
        resultEl.style.display = 'block';
      }
    }

    async function callTool() {
      try {
        const result = await mcpRequest('tools/call', {
          name: 'pick-color',
          arguments: { initialColor: '#ff6b6b' }
        });

        resultEl.textContent = 'Tool Result:\n' + JSON.stringify(result.result, null, 2);
        resultEl.style.display = 'block';
      } catch (e) {
        resultEl.textContent = 'Error: ' + e.message;
        resultEl.style.display = 'block';
      }
    }

    loadBtn.addEventListener('click', loadApp);
    callToolBtn.addEventListener('click', callTool);

    checkConnection();
  </script>
</body>
</html>
